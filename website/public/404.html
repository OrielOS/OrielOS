<!doctype html>
<!--

SPDX-License-Identifier: GPL-3.0-or-later

The not-found page. website/build.mjs adds the site's header and footer. It
can be served at any address, so every link and file on it starts with "/".
The Content-Security-Policy is the home page's: see the comment there.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; style-src 'self'; img-src 'self' https://www.bestpractices.dev; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Page not found · OrielOS</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#cadafb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050a1c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" href="/news/feed.xml" title="OrielOS news">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- include:header -->

<main class="not-found" id="main">
  <div class="wrap">
    <h1>Page not found</h1>
    <p class="lead">There’s nothing at this address. It may have moved, or the link may have a typo. The <a href="/guides/">guides</a> have an A to Z of every topic.</p>
    <a class="button primary" href="/">Go to the home page</a>
  </div>
</main>

<!-- include:footer -->
</body>
</html>
