name: Bug report
description: Something in OrielOS does not work as it should
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: build
    attributes:
      label: OrielOS build
      description: Paste the output of `rpm-ostree status` or `bootc status`.
      render: text
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      description: For example "RTX 4070, driver 580.xx". `nvidia-smi` shows both.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant excerpts from `journalctl -b`. Remove anything private.
      render: text
