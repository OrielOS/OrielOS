name: Discord

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
  issues:
    types: [opened, labeled]
  discussion:
    types: [created, answered]
  pull_request:
    paths:
      - "discord/**"
      - ".github/workflows/discord.yml"

permissions: {}

jobs:
  test:
    name: test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Every push to main starts this workflow for the post job, so the tests are skipped
      # unless the bot changed. Pull requests start it only when the bot changed. A pull
      # request's checkout is the pull request merged into its base branch, so HEAD^1 is the
      # base. A push of more than one commit, or a comparison that fails, counts as a change.
      - name: Check whether the change affects the bot
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          rc=0
          if [ "${EVENT}" = "push" ] && [ "$(git rev-parse HEAD^1 2>/dev/null)" != "${BEFORE}" ]; then
              rc=2
          else
              git diff --quiet HEAD^1 HEAD -- discord .github/workflows/discord.yml || rc=$?
          fi
          case "${rc}" in
              0)
                  changed=false
                  echo "::notice::The bot hasn't changed, so its tests were not run."
                  ;;
              1) changed=true ;;
              *)
                  changed=true
                  echo "::warning::Couldn't compare with the previous commit, so the bot's tests are run."
                  ;;
          esac
          echo "changed=${changed}" >>"${GITHUB_OUTPUT}"

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the bot's dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: discord
        run: npm ci --ignore-scripts

      - name: Test the bot
        if: steps.changes.outputs.changed == 'true'
        working-directory: discord
        run: npm test

  post:
    name: post
    if: >-
      github.repository == 'ncjsvr/OrielOS' &&
      (github.event_name == 'release' ||
      github.event_name == 'issues' ||
      github.event_name == 'discussion' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: discord
      deployment: false
    # No concurrency group: GitHub keeps only one waiting run per group, so a
    # burst of issues or merges would cancel some posts.
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the bot's dependencies
        working-directory: discord
        run: npm ci --ignore-scripts

      - name: Post to Discord
        working-directory: discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CHANNEL_FEED: "1563925191057346662"
        run: node src/post.js

  sync:
    name: sync
    if: >-
      github.repository == 'ncjsvr/OrielOS' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: discord
      deployment: false
    concurrency:
      group: discord-sync
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the bot's dependencies
        working-directory: discord
        run: npm ci --ignore-scripts

      - name: Sync Discord roles
        working-directory: discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LINK_CLIENT_ID: ${{ vars.LINK_CLIENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CHANNEL_FEED: "1563925191057346662"
          LINK_CHANNEL: "1563925111805845534"
          LINK_MESSAGE: "1563926132112228403"
        run: node src/sync.js
