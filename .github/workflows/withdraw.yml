name: Withdraw

# Takes a bad build off the testing channel by moving the testing tag back to an earlier build,
# without rebuilding it: the same image, digest and signature. Run by hand by the maintainer.
# Computers on testing stage that build at their next update check, whether they run the
# withdrawn build, have it staged or never got it, because orielos-update stages whatever digest
# the channel points to. The withdrawn build keeps its own tag, and its testing pre-release on
# GitHub is marked withdrawn. The next build published from main moves testing on again, so merge
# the fix or a revert after running this.

on:
  workflow_dispatch:
    inputs:
      build:
        description: Earlier build for testing to go back to, such as v0.0.6
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REPOSITORY: ghcr.io/ncjsvr/orielos

jobs:
  withdraw:
    name: withdraw
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The input is checked before anything uses it, and only ever reaches the shell as an
      # environment variable.
      - name: Check the input
        env:
          BUILD: ${{ inputs.build }}
        run: |
          [[ "${BUILD}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The build looks like v0.0.6"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the build is signed, then move testing back to it
        env:
          BUILD: ${{ inputs.build }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s image/keys/orielos-cosign.pub ] || { echo "::error::image/keys/orielos-cosign.pub is missing, so the signature can't be checked"; exit 1; }
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${REPOSITORY}:${BUILD}")" ||
              { echo "::error::There is no build ${BUILD} in ${REPOSITORY}"; exit 1; }
          current="$(skopeo inspect --format '{{.Digest}}' "docker://${REPOSITORY}:testing")"
          if [ "${digest}" = "${current}" ]; then
              echo "::error::testing is already ${BUILD} (${digest})"
              exit 1
          fi
          cosign verify --key image/keys/orielos-cosign.pub "${REPOSITORY}@${digest}" >/dev/null
          printf '%s' "${GITHUB_TOKEN}" | skopeo login ghcr.io --username "${ACTOR}" --password-stdin
          skopeo copy --preserve-digests "docker://${REPOSITORY}@${digest}" "docker://${REPOSITORY}:testing"
          echo "::notice::testing is now ${BUILD} (${digest}); it was ${current}"

      # The builds after the one testing went back to are withdrawn: their testing pre-releases
      # (the Testing release workflow) say so, and the website stops offering them.
      - name: Mark the withdrawn builds' pre-releases
        env:
          BUILD: ${{ inputs.build }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t withdrawn < <(skopeo list-tags "docker://${REPOSITORY}" | jq -r '.Tags[]' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V |
              awk -v from="${BUILD}" 'on { print } $0 == from { on = 1 }')
          for version in "${withdrawn[@]}"; do
              prerelease="$(gh release view "${version}" --json isPrerelease --jq .isPrerelease 2>/dev/null || true)"
              [ "${prerelease}" = "true" ] || continue
              title="$(gh release view "${version}" --json name --jq .name)"
              [[ "${title}" == *"(testing, withdrawn)" ]] && continue
              { printf '**Withdrawn.** Computers on the testing channel went back to %s.\n\n' "${BUILD}"; gh release view "${version}" --json body --jq .body; } >/tmp/notes.md
              gh release edit "${version}" --title "OrielOS ${version} (testing, withdrawn)" --notes-file /tmp/notes.md
              echo "::notice::Marked ${version}'s pre-release as withdrawn"
          done
          gh workflow run website.yml --repo "${GITHUB_REPOSITORY}" --ref main
