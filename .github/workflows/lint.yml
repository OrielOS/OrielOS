name: Lint

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pinned linters are kept between runs, keyed on their pins, so they're downloaded once
      # per change to the pins. Only main saves them; pull requests read main's.
      - name: Restore the linters
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('tools/lint-tools.env', 'tools/lint-requirements.txt') }}

      - name: Install the linters
        run: tools/install-lint-tools.sh

      - name: Keep the linters
        if: github.event_name == 'push' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('tools/lint-tools.env', 'tools/lint-requirements.txt') }}

      - name: Lint
        run: tools/lint.sh
