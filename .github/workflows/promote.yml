name: Promote

# Moves the stable tag to a build that has been on testing, without rebuilding it: the same image,
# digest and signature. Run by hand by the maintainer once the build has passed the real-hardware
# checklist. Each build's version is its name, so the GitHub Release is named after the build and
# tagged at the commit it was built from. Its notes say how to get it, then give the CHANGELOG's
# Unreleased section at that commit, and a branch for the maintainer turns that part into the
# version's own section. The installer workflow then attaches OrielOS.iso to the release.

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build to promote, such as v0.0.7
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REPOSITORY: ghcr.io/ncjsvr/orielos

jobs:
  promote:
    name: promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes are read from the commit the build was made from.
          fetch-depth: 0

      # The input is checked before anything uses it, and only ever reaches the shell as an
      # environment variable.
      - name: Check the input
        env:
          BUILD: ${{ inputs.build }}
        run: |
          [[ "${BUILD}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The build looks like v0.0.7"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/${BUILD}" >/dev/null; then
              echo "::error::${BUILD} has already been released"
              exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the build is signed, then move stable to it
        env:
          BUILD: ${{ inputs.build }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s image/keys/orielos-cosign.pub ] || { echo "::error::image/keys/orielos-cosign.pub is missing, so the signature can't be checked"; exit 1; }
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${REPOSITORY}:${BUILD}")"
          # The commit the build was made from, which the release is tagged at.
          revision="$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.revision"}}' "docker://${REPOSITORY}@${digest}")"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${BUILD} has no revision label, so its commit isn't known"; exit 1; }
          cosign verify --key image/keys/orielos-cosign.pub "${REPOSITORY}@${digest}" >/dev/null
          printf '%s' "${GITHUB_TOKEN}" | skopeo login ghcr.io --username "${ACTOR}" --password-stdin
          skopeo copy --preserve-digests "docker://${REPOSITORY}@${digest}" "docker://${REPOSITORY}:stable"
          echo "DIGEST=${digest}" >>"${GITHUB_ENV}"
          echo "REVISION=${revision}" >>"${GITHUB_ENV}"
          echo "::notice::stable is now ${BUILD} (${digest})"

      # The notes are the Unreleased section as it was at the commit the build was made from:
      # anything merged after that isn't in the release.
      - name: Write the release notes from the CHANGELOG
        run: |
          git show "${REVISION}:CHANGELOG.md" | awk '/^## \[Unreleased\]/ {on = 1; next} on && /^## \[/ {exit} on' >/tmp/released.md
          grep -q '[^[:space:]]' /tmp/released.md || { echo "::error::The CHANGELOG's Unreleased section was empty at ${REVISION}"; exit 1; }
          {
              cat <<EOF
          **Stable release.**

          - **New to OrielOS?** Download \`OrielOS.iso\` below and follow [Install OrielOS](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/install.md), or get it from [orielos.org](https://orielos.org).
          - **Already running OrielOS?** There's nothing to download: it arrives by itself. To get it now, open Settings → Update and choose Check for updates.
          - **Want new versions sooner?** Switch to the testing channel in Settings → Update.

          EOF
              cat /tmp/released.md
              printf '\nImage digest %s.\n' "${DIGEST}"
          } >/tmp/notes.md

      - name: Create the release
        env:
          VERSION: ${{ inputs.build }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${VERSION}" --target "${REVISION}" --title "OrielOS ${VERSION}" --notes-file /tmp/notes.md

      # A release made with GITHUB_TOKEN starts no other workflows, so the installer workflow is
      # started by hand: it attaches OrielOS.iso and SHA256SUMS to this release, the latest one,
      # and rebuilds the website.
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run installer.yml --repo "${GITHUB_REPOSITORY}" --ref main

      # What the release contains moves from Unreleased to the release's own section; changes merged
      # after the build's commit stay under Unreleased (tools/release-changelog.sh). It goes on a
      # branch for the maintainer to open a pull request from: GitHub doesn't let Actions open one,
      # and a pull request opened with GITHUB_TOKEN wouldn't run the required checks.
      - name: Put the CHANGELOG's new section on a branch
        env:
          VERSION: ${{ inputs.build }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="docs/changelog-${VERSION}"
          tools/release-changelog.sh CHANGELOG.md /tmp/released.md "${VERSION}" "$(date -u +%Y-%m-%d)" >/tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -s -am "docs: start the CHANGELOG's section for ${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${branch}"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          echo "::notice::Open a pull request for the CHANGELOG: ${url}"
          printf 'Open a pull request for the CHANGELOG: %s\n' "${url}" >>"${GITHUB_STEP_SUMMARY}"
