name: DCO

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that every commit is signed off
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
              email="$(git log -1 --format='%ae' "${sha}")"
              # Compare as a fixed string: the email comes from the pull request's commits.
              if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "${sha}" | grep -qiF "<${email}>"; then
                  echo "::error::Commit ${sha} has no Signed-off-by line for ${email}. Use 'git commit -s'."
                  failed=1
              fi
          done
          exit "${failed}"
