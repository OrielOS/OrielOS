name: DCO

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that every commit is signed off
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
              email="$(git log -1 --format='%ae' "${sha}")"
              # Compare as a fixed string: the email comes from the pull request's commits.
              if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "${sha}" | grep -qiF "<${email}>"; then
                  echo "::error::Commit ${sha} has no Signed-off-by line for ${email}. Use 'git commit -s'."
                  failed=1
              fi
          done
          exit "${failed}"

  # dco is a required check, so the merge queue needs it too. Every commit was checked on the pull
  # request; the commit the queue makes is GitHub's own squash of them.
  dco-queue:
    name: dco
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass for the merge queue
        run: echo "Every commit in this pull request was checked for a sign-off on the pull request."
