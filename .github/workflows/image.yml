name: Image

# Builds the OS image when a change that affects it merges into main, or by hand: smoke-tests it in
# a VM, checks that Flathub has the NVIDIA driver extension it needs, then publishes it to
# ghcr.io/orielos/orielos under its version (v0.0.1, v0.0.2, ...), signs it with cosign and moves the
# testing tag to it. The Testing release workflow then gives the build a GitHub pre-release saying
# what's new in it.
# A pull request that changes this workflow or the build script only builds: changes are booted
# and update-tested locally before they merge, so pull requests don't smoke-test on GitHub, and
# they never publish.
# A merge that changes only image/pins.env (Renovate's weekly refresh of the upstream images)
# doesn't build either: the new digests are boot-tested locally before they merge, and go out in
# the next build that a change to OrielOS itself, or a run by hand, makes.

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - artwork/**
      - data/**
      - image/**
      - plasma/**
      - CMakeLists.txt
      - .containerignore
      - tools/build-image.sh
      - tools/next-version.sh
      - tests/smoke-test.sh
      - tests/lib/vm.sh
      - .github/workflows/image.yml
      - "!**.md"
      - "!image/pins.env"
  pull_request:
    paths:
      - tools/build-image.sh
      - tools/next-version.sh
      - tools/lib/stage-inputs.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions: {}

# Builds of main run one at a time, so two merges on the same day get different build numbers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPOSITORY: ghcr.io/orielos/orielos
  # The image's address before OrielOS moved to its own organisation on GitHub. Builds published
  # there still count when numbering, and the newest of them is copied here before the first
  # publish (see "Publish, sign and move testing").
  PREVIOUS_REPOSITORY: ghcr.io/ncjsvr/orielos

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # packages: write lets the build push its image, untagged, while it's smoke-tested (see
    # "Start uploading the image"). The signing key stays with the publish job, and computers only
    # take signed builds, so this job can't publish anything they would install.
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image and its build stages need tens of gigabytes. Podman's storage and temporary
      # files go on /mnt, mounted where the scripts expect them (the installer reads
      # /var/lib/containers). The runner's disk has room for the build as it comes (145 GB with
      # about 88 GB free), so its preinstalled toolchains are no longer deleted first, which took
      # one to two minutes.
      - name: Make room for the build
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers /mnt/builds /mnt/tmp /mnt/vm /var/lib/containers/storage /var/lib/orielos/vm
          sudo mount --bind /mnt/containers /var/lib/containers/storage
          sudo mount --bind /mnt/vm /var/lib/orielos/vm
          sudo chmod 1777 /mnt/tmp


      # The apps compile with the compiler cache the apps workflow keeps on main, and this build
      # only reads it.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: apps-ccache-${{ hashFiles('image/pins.env') }}-image-${{ github.run_id }}
          restore-keys: apps-ccache-${{ hashFiles('image/pins.env') }}-

      # The packages apt downloads are kept between runs, so a slow mirror only costs the first run
      # on each new runner image. apt checks every cached file against Ubuntu's signed package
      # index before installing it. Pull requests don't smoke-test, so they never read or write it.
      - name: Name the package cache
        if: github.event_name != 'pull_request'
        id: apt-key
        run: echo "key=apt-${ImageOS}-${ImageVersion}" >>"${GITHUB_OUTPUT}"

      - name: Restore the smoke test's packages
        if: github.event_name != 'pull_request'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: apt-

      # Every tool comes from Ubuntu's signed archive; nothing is installed unpinned from PyPI.
      # A stalled download is retried rather than waited on.
      - name: Install the tools for the smoke test
        if: github.event_name != 'pull_request'
        run: |
          archives="${RUNNER_TEMP}/apt-archives"
          mkdir -p "${archives}/partial"
          apt=(-o "Dir::Cache::Archives=${archives}" -o APT::Keep-Downloaded-Packages=true
              -o Acquire::Retries=5 -o Acquire::http::Timeout=30)
          sudo apt-get "${apt[@]}" update -q
          sudo apt-get "${apt[@]}" install -y -q qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools socat flatpak skopeo python3-virt-firmware eatmydata
          # Packages Ubuntu no longer offers leave the cache.
          sudo apt-get "${apt[@]}" autoclean -q
          sudo chmod -R a+rX "${archives}"
          sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
          sudo modprobe vhost_vsock
          ls -l /dev/kvm /dev/vhost-vsock
          # Ubuntu's AppArmor profile for swtpm lets it write only in libvirt's folders, so the VM's
          # TPM socket and state, in /var/lib/orielos/vm (a bind mount of /mnt/vm), were refused.
          # The profile's local include allows those two folders as well.
          if [[ -f /etc/apparmor.d/usr.bin.swtpm ]]; then
              sudo mkdir -p /etc/apparmor.d/local
              printf 'owner /var/lib/orielos/vm/** rwk,\nowner /mnt/vm/** rwk,\n' |
                  sudo tee -a /etc/apparmor.d/local/usr.bin.swtpm >/dev/null
              sudo apparmor_parser -r /etc/apparmor.d/usr.bin.swtpm
          fi

      - name: Keep the smoke test's packages
        if: github.event_name != 'pull_request' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}

      # Each published build is the next version after the highest one in either registry
      # (tools/next-version.sh): v0.0.1, v0.0.2 and on, rolling over after v0.0.10 to v0.1.0. A
      # pull request's build gets the number the next publish would, but never publishes it. If
      # the earlier registry can't be read, the job stops rather than count from v0.0.1 again; the
      # new one has nothing until its first publish.
      - name: Choose the version
        id: tag
        run: |
          tags="$(skopeo list-tags "docker://${PREVIOUS_REPOSITORY}" | jq -r '.Tags[]')"
          if current="$(skopeo list-tags "docker://${REPOSITORY}" 2>/dev/null)"; then
              tags+=$'\n'"$(jq -r '.Tags[]' <<<"${current}")"
          fi
          tag="$(tools/next-version.sh <<<"${tags}")"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tools/next-version.sh gave '${tag}'"; exit 1; }
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "::notice::This build is ${tag}"

      # cosign checks the signature of a prebuilt stage before the build starts from it.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The build starts from the prebuilt OS base and build tools (.github/workflows/stages.yml)
      # where they were built from this commit's inputs, and builds them itself otherwise. Each
      # stage is committed once: on this kernel Podman can't use overlayfs's own diff, so a commit
      # at every step compared the whole image each time, about 14 s a step.
      - name: Build the image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CCACHE: ${{ runner.temp }}/ccache
        run: |
          # Root gets the system's own folders and cosign's, not the runner user's whole PATH.
          root_path="$(dirname "$(command -v cosign)"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          sudo env TMPDIR=/mnt/tmp ORIELOS_CCACHE_DIR="${CCACHE}" PATH="${root_path}" tools/build-image.sh --use-published --single-layer --no-archive --version "${TAG}" --output /mnt/builds --keep 1

      # The image goes up to the registry while it's smoke-tested, instead of being handed to the
      # publish job as an archive afterwards (about 4 min). It's written to an OCI folder with
      # zstd, then pushed by its digest alone: with no tag, no computer updates to it and the
      # version count doesn't see it. The publish job signs it and tags it only once the smoke test
      # has passed; a build that fails leaves an untagged image behind. Runs by hand on other
      # branches upload too, so a change here can be tried before it merges, but only main's
      # builds are ever published. Pull requests don't upload. It runs at the lowest CPU and disk
      # priority, so the smoke test's install keeps the runner's four cores.
      - name: Start uploading the image
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p /mnt/builds/upload
          printf '%s' "${GITHUB_TOKEN}" |
              sudo skopeo login --authfile /mnt/builds/upload/auth.json ghcr.io --username "${ACTOR}" --password-stdin
          cat >"${RUNNER_TEMP}/upload.sh" <<'EOF'
          set -euo pipefail
          dir=/mnt/builds/upload
          podman push --compression-format zstd --digestfile "${dir}/digest" "localhost/orielos:${TAG}" "oci:${dir}/oci:${TAG}"
          skopeo copy --authfile "${dir}/auth.json" --preserve-digests --retry-times 3 \
              "oci:${dir}/oci:${TAG}" "docker://${REPOSITORY}@$(cat "${dir}/digest")"
          rm -f "${dir}/auth.json"
          EOF
          sudo env TAG="${TAG}" REPOSITORY="${REPOSITORY}" \
              bash -c 'nohup nice -n 19 ionice -c 2 -n 7 bash "$0" >/mnt/builds/upload.log 2>&1; echo $? >/mnt/builds/upload.status' "${RUNNER_TEMP}/upload.sh" &

      # Flatpak apps need Flathub's GL extension for the image's NVIDIA driver version, or they
      # lose GPU acceleration after the update.
      - name: Check Flathub has the NVIDIA driver extension
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          driver="$(sudo podman run --rm "localhost/orielos:${TAG}" rpm -q --qf '%{VERSION}' nvidia-driver)"
          extension="org.freedesktop.Platform.GL.nvidia-${driver//./-}"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          if flatpak remote-ls --user --runtime --columns=application flathub | grep -qxF "${extension}"; then
              echo "::notice::Flathub has ${extension}"
          else
              echo "::error::Flathub has no ${extension} for the NVIDIA driver ${driver}, so this build isn't published."
              exit 1
          fi

      - name: Smoke-test the image in a VM
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sudo env TMPDIR=/mnt/tmp tests/smoke-test.sh --image "localhost/orielos:${TAG}" --results /mnt/smoke-results

      - name: Keep the smoke test's results
        if: always() && github.event_name != 'pull_request'
        run: sudo chmod -R a+rX /mnt/smoke-results 2>/dev/null || true

      - name: Upload the smoke test's results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results
          path: /mnt/smoke-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Finish uploading the image
        id: upload
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        run: |
          until [ -f /mnt/builds/upload.status ]; do sleep 2; done
          sudo rm -f /mnt/builds/upload/auth.json
          cat /mnt/builds/upload.log
          [ "$(cat /mnt/builds/upload.status)" = 0 ] || { echo "::error::Uploading the image failed"; exit 1; }
          digest="$(cat /mnt/builds/upload/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::The upload gave no digest ('${digest}')"; exit 1; }
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          echo "::notice::Uploaded ${REPOSITORY}@${digest}, untagged until it's published"

  publish:
    name: publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: publish
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.key.outputs.ready }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds are never published unsigned. Until the publish environment has the signing key,
      # the build is tested but not published, and the job says so without failing.
      - name: Check that the signing key is set up
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
              echo "::notice::Not published: the publish environment has no COSIGN_PRIVATE_KEY secret yet, and builds are never published unsigned (see image/README.md)."
              echo "ready=false" >>"${GITHUB_OUTPUT}"
          else
              echo "ready=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Install cosign
        if: steps.key.outputs.ready == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The build job uploaded the image by its digest during the smoke test. It's signed before
      # any tag points at it, then gets its version tag and testing, so no computer on testing
      # ever sees an unsigned build. Tagging only writes a manifest; the layers are already there.
      - name: Publish, sign and move testing
        if: steps.key.outputs.ready == 'true'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          printf '%s' "${GITHUB_TOKEN}" | skopeo login ghcr.io --username "${ACTOR}" --password-stdin
          printf '%s' "${GITHUB_TOKEN}" | cosign login ghcr.io --username "${ACTOR}" --password-stdin
          # Once, before the first publish here: copy the newest build from the earlier address, with
          # its signature, so the testing release workflow finds the build before this one.
          if ! skopeo list-tags "docker://${REPOSITORY}" 2>/dev/null | jq -e '.Tags | any(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' >/dev/null; then
              latest="$(skopeo list-tags "docker://${PREVIOUS_REPOSITORY}" | jq -r '.Tags[]' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
              earlier="$(skopeo inspect --format '{{.Digest}}' "docker://${PREVIOUS_REPOSITORY}:${latest}")"
              skopeo copy --preserve-digests "docker://${PREVIOUS_REPOSITORY}:${latest}" "docker://${REPOSITORY}:${latest}"
              signature="sha256-${earlier#sha256:}.sig"
              skopeo copy --preserve-digests "docker://${PREVIOUS_REPOSITORY}:${signature}" "docker://${REPOSITORY}:${signature}"
              echo "::notice::Copied ${latest} (${earlier}) from ${PREVIOUS_REPOSITORY}"
          fi
          # A version names one build for good, so an existing tag is never pushed over.
          if skopeo inspect --raw "docker://${REPOSITORY}:${TAG}" >/dev/null 2>&1; then
              echo "::error::${REPOSITORY}:${TAG} already exists; versions are never reused"
              exit 1
          fi
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::The build job gave no digest ('${DIGEST}')"; exit 1; }
          skopeo inspect --raw "docker://${REPOSITORY}@${DIGEST}" >/dev/null ||
              { echo "::error::${REPOSITORY}@${DIGEST} isn't in the registry"; exit 1; }
          # The classic signature format, attached as a sha256-<digest>.sig tag: installed computers
          # check updates with containers/image (bootc, podman), which finds no signature in cosign 3's
          # default bundle format and would refuse every update.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${REPOSITORY}@${DIGEST}"
          if [ -s image/keys/orielos-cosign.pub ]; then
              cosign verify --key image/keys/orielos-cosign.pub "${REPOSITORY}@${DIGEST}" >/dev/null
          fi
          skopeo copy --preserve-digests "docker://${REPOSITORY}@${DIGEST}" "docker://${REPOSITORY}:${TAG}"
          skopeo copy --preserve-digests "docker://${REPOSITORY}@${DIGEST}" "docker://${REPOSITORY}:testing"
          echo "::notice::Published ${REPOSITORY}:${TAG} (${DIGEST}) and moved testing to it"

  # Each published build gets a pre-release on GitHub saying what's new in it.
  notes:
    name: notes
    needs: [build, publish]
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/testing-release.yml
    with:
      build: ${{ needs.build.outputs.tag }}
