name: Image

# Builds the OS image when a change that affects it merges into main, or by hand: smoke-tests it in
# a VM, checks that Flathub has the NVIDIA driver extension it needs, then publishes it to
# ghcr.io/ncjsvr/orielos under its version (v0.0.1, v0.0.2, ...), signs it with cosign and moves the
# testing tag to it.
# A pull request that changes this workflow or the build script only builds: changes are booted
# and update-tested locally before they merge, so pull requests don't smoke-test on GitHub, and
# they never publish.

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - artwork/**
      - image/**
      - plasma/**
      - CMakeLists.txt
      - .containerignore
      - tools/build-image.sh
      - tools/next-version.sh
      - tests/smoke-test.sh
      - tests/lib/vm.sh
      - .github/workflows/image.yml
      - "!**.md"
  pull_request:
    paths:
      - tools/build-image.sh
      - tools/next-version.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions: {}

# Builds of main run one at a time, so two merges on the same day get different build numbers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPOSITORY: ghcr.io/ncjsvr/orielos

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image and its build stages need tens of gigabytes. The runner's preinstalled
      # toolchains are removed, and Podman's storage and temporary files go on the larger /mnt
      # disk, mounted where the scripts expect them (the installer reads /var/lib/containers).
      - name: Make room for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo mkdir -p /mnt/containers /mnt/builds /mnt/tmp /mnt/vm /var/lib/containers/storage /var/lib/orielos/vm
          sudo mount --bind /mnt/containers /var/lib/containers/storage
          sudo mount --bind /mnt/vm /var/lib/orielos/vm
          sudo chmod 1777 /mnt/tmp
          df -h / /mnt

      # The packages apt downloads are kept between runs, so a slow mirror only costs the first run
      # on each new runner image. apt checks every cached file against Ubuntu's signed package
      # index before installing it. Pull requests don't smoke-test, so they never read or write it.
      - name: Name the package cache
        if: github.event_name != 'pull_request'
        id: apt-key
        run: echo "key=apt-${ImageOS}-${ImageVersion}" >>"${GITHUB_OUTPUT}"

      - name: Restore the smoke test's packages
        if: github.event_name != 'pull_request'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: apt-

      # Every tool comes from Ubuntu's signed archive; nothing is installed unpinned from PyPI.
      # A stalled download is retried rather than waited on.
      - name: Install the tools for the smoke test
        if: github.event_name != 'pull_request'
        run: |
          archives="${RUNNER_TEMP}/apt-archives"
          mkdir -p "${archives}/partial"
          apt=(-o "Dir::Cache::Archives=${archives}" -o APT::Keep-Downloaded-Packages=true
              -o Acquire::Retries=5 -o Acquire::http::Timeout=30)
          sudo apt-get "${apt[@]}" update -q
          sudo apt-get "${apt[@]}" install -y -q qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools socat flatpak skopeo python3-virt-firmware
          # Packages Ubuntu no longer offers leave the cache.
          sudo apt-get "${apt[@]}" autoclean -q
          sudo chmod -R a+rX "${archives}"
          sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
          sudo modprobe vhost_vsock
          ls -l /dev/kvm /dev/vhost-vsock
          # Ubuntu's AppArmor profile for swtpm lets it write only in libvirt's folders, so the VM's
          # TPM socket and state, in /var/lib/orielos/vm (a bind mount of /mnt/vm), were refused.
          # The profile's local include allows those two folders as well.
          if [[ -f /etc/apparmor.d/usr.bin.swtpm ]]; then
              sudo mkdir -p /etc/apparmor.d/local
              printf 'owner /var/lib/orielos/vm/** rwk,\nowner /mnt/vm/** rwk,\n' |
                  sudo tee -a /etc/apparmor.d/local/usr.bin.swtpm >/dev/null
              sudo apparmor_parser -r /etc/apparmor.d/usr.bin.swtpm
          fi

      - name: Keep the smoke test's packages
        if: github.event_name != 'pull_request' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}

      # Each published build is the next version after the highest one in the registry
      # (tools/next-version.sh): v0.0.1, v0.0.2 and on, rolling over after v0.0.10 to v0.1.0. A
      # pull request's build gets the number the next publish would, but never publishes it. If
      # the registry can't be read, the job stops rather than count from v0.0.1 again.
      - name: Choose the version
        id: tag
        run: |
          tags="$(skopeo list-tags "docker://${REPOSITORY}" | jq -r '.Tags[]')"
          tag="$(tools/next-version.sh <<<"${tags}")"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tools/next-version.sh gave '${tag}'"; exit 1; }
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "::notice::This build is ${tag}"

      - name: Build the image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sudo env TMPDIR=/mnt/tmp tools/build-image.sh --version "${TAG}" --output /mnt/builds --keep 1

      # Flatpak apps need Flathub's GL extension for the image's NVIDIA driver version, or they
      # lose GPU acceleration after the update.
      - name: Check Flathub has the NVIDIA driver extension
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          driver="$(sudo podman run --rm "localhost/orielos:${TAG}" rpm -q --qf '%{VERSION}' nvidia-driver)"
          extension="org.freedesktop.Platform.GL.nvidia-${driver//./-}"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          if flatpak remote-ls --user --runtime --columns=application flathub | grep -qxF "${extension}"; then
              echo "::notice::Flathub has ${extension}"
          else
              echo "::error::Flathub has no ${extension} for the NVIDIA driver ${driver}, so this build isn't published."
              exit 1
          fi

      - name: Smoke-test the image in a VM
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sudo env TMPDIR=/mnt/tmp tests/smoke-test.sh --image "localhost/orielos:${TAG}" --results /mnt/smoke-results

      - name: Keep the smoke test's results
        if: always() && github.event_name != 'pull_request'
        run: sudo chmod -R a+rX /mnt/smoke-results 2>/dev/null || true

      - name: Upload the smoke test's results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results
          path: /mnt/smoke-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Make the archive readable
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: sudo chmod a+r /mnt/builds/*.ociarchive

      - name: Upload the image for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: /mnt/builds/orielos-${{ steps.tag.outputs.tag }}.ociarchive
          compression-level: 0
          retention-days: 1

  publish:
    name: publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds are never published unsigned. Until the publish environment has the signing key,
      # the build is tested but not published, and the job says so without failing.
      - name: Check that the signing key is set up
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
              echo "::notice::Not published: the publish environment has no COSIGN_PRIVATE_KEY secret yet, and builds are never published unsigned (see image/README.md)."
              echo "ready=false" >>"${GITHUB_OUTPUT}"
          else
              echo "ready=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Download the image
        if: steps.key.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: /tmp/image

      - name: Install cosign
        if: steps.key.outputs.ready == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The version tag is pushed and signed first; testing moves to it only once the signature is
      # there, so no computer on testing ever sees an unsigned build.
      - name: Publish, sign and move testing
        if: steps.key.outputs.ready == 'true'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          printf '%s' "${GITHUB_TOKEN}" | skopeo login ghcr.io --username "${ACTOR}" --password-stdin
          printf '%s' "${GITHUB_TOKEN}" | cosign login ghcr.io --username "${ACTOR}" --password-stdin
          # A version names one build for good, so an existing tag is never pushed over.
          if skopeo inspect --raw "docker://${REPOSITORY}:${TAG}" >/dev/null 2>&1; then
              echo "::error::${REPOSITORY}:${TAG} already exists; versions are never reused"
              exit 1
          fi
          skopeo copy --digestfile /tmp/digest "oci-archive:/tmp/image/orielos-${TAG}.ociarchive:${TAG}" "docker://${REPOSITORY}:${TAG}"
          digest="$(cat /tmp/digest)"
          # The classic signature format, attached as a sha256-<digest>.sig tag: installed computers
          # check updates with containers/image (bootc, podman), which finds no signature in cosign 3's
          # default bundle format and would refuse every update.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${REPOSITORY}@${digest}"
          if [ -s image/keys/orielos-cosign.pub ]; then
              cosign verify --key image/keys/orielos-cosign.pub "${REPOSITORY}@${digest}" >/dev/null
          fi
          skopeo copy --preserve-digests "docker://${REPOSITORY}@${digest}" "docker://${REPOSITORY}:testing"
          echo "::notice::Published ${REPOSITORY}:${TAG} (${digest}) and moved testing to it"
