name: Prebuilt stages

# Builds the Containerfile's app-deps and os-base stages and publishes them as
# ghcr.io/orielos/orielos-builder and ghcr.io/orielos/orielos-base, signed with cosign and
# labelled with a hash of their inputs (tools/lib/stage-inputs.sh). The apps check and the image
# build start from them when that hash matches their own checkout, and build the stage
# themselves otherwise, so a change is never built on a stale stage.
# They're rebuilt when their inputs change on main, and daily, so Fedora's package updates reach
# the next image build. A pull request that changes this workflow or the hash only builds them.

on:
  push:
    branches: [main]
    paths:
      - image/Containerfile
      - image/build/**
      - image/packages/**
      - image/keys/**
      - image/sddm/orielos/**
      - plasma/shell/**
      - image/pins.env
      - tools/build-image.sh
      - tools/lib/**
      - .github/workflows/stages.yml
      - "!**.md"
  pull_request:
    paths:
      - tools/lib/stage-inputs.sh
      - .github/workflows/stages.yml
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/orielos

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Podman's storage and temporary files go on /mnt, mounted where the scripts expect them.
      - name: Make room for the build
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers /mnt/builds /mnt/tmp /var/lib/containers/storage
          sudo mount --bind /mnt/containers /var/lib/containers/storage
          sudo chmod 1777 /mnt/tmp

      # As in the image build: without overlayfs's redirect_dir, Podman commits each build step
      # with the kernel's own diff instead of comparing the whole image.
      - name: Let Podman use overlayfs's own diff
        run: |
          sudo modprobe overlay
          # Ubuntu's storage.conf mounts with metacopy=on, which turns redirect_dir back on.
          sudo sed -i 's/metacopy=on/metacopy=off/g' /etc/containers/storage.conf /usr/share/containers/storage.conf 2>/dev/null || true
          echo N | sudo tee /sys/module/overlay/parameters/redirect_dir /sys/module/overlay/parameters/metacopy >/dev/null
          grep -h '^mountopt' /etc/containers/storage.conf /usr/share/containers/storage.conf 2>/dev/null || true
          echo "Native overlay diff: $(sudo podman info --format '{{index .Store.GraphStatus "Native Overlay Diff"}}')"
          sudo podman --log-level=debug info 2>&1 | grep -iE 'native diff|redirect|metacopy' || true

      - name: Build the stages
        run: sudo env TMPDIR=/mnt/tmp tools/build-image.sh --stages-only --output /mnt/builds

      - name: Make the archives readable
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: sudo chmod a+r /mnt/builds/*.ociarchive

      - name: Upload the stages for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stages
          path: |
            /mnt/builds/orielos-builder.ociarchive
            /mnt/builds/orielos-base.ociarchive
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stages are never published unsigned: builds only use a stage whose signature verifies.
      - name: Check that the signing key is set up
        id: key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
              echo "::notice::Not published: the publish environment has no COSIGN_PRIVATE_KEY secret yet."
              echo "ready=false" >>"${GITHUB_OUTPUT}"
          else
              echo "ready=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Download the stages
        if: steps.key.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stages
          path: /tmp/stages

      - name: Install cosign
        if: steps.key.outputs.ready == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Each stage is pushed under a dated tag and signed; latest moves to it only once the
      # signature is there and verifies.
      - name: Publish and sign the stages
        if: steps.key.outputs.ready == 'true'
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          printf '%s' "${GITHUB_TOKEN}" | skopeo login ghcr.io --username "${ACTOR}" --password-stdin
          printf '%s' "${GITHUB_TOKEN}" | cosign login ghcr.io --username "${ACTOR}" --password-stdin
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          for name in orielos-builder orielos-base; do
              skopeo copy --digestfile "/tmp/${name}.digest" \
                  "oci-archive:/tmp/stages/${name}.ociarchive:latest" "docker://${REGISTRY}/${name}:${stamp}"
              digest="$(cat "/tmp/${name}.digest")"
              cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${REGISTRY}/${name}@${digest}"
              cosign verify --key image/keys/orielos-cosign.pub "${REGISTRY}/${name}@${digest}" >/dev/null
              skopeo copy --preserve-digests "docker://${REGISTRY}/${name}@${digest}" "docker://${REGISTRY}/${name}:latest"
              echo "::notice::Published ${REGISTRY}/${name}:${stamp} (${digest}) and moved latest to it"
          done
