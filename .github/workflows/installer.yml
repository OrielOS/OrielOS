name: Installer

# Builds OrielOS.iso, the network installer (installer/build-iso.sh), which installs the current
# stable build. It downloads OrielOS while it installs, so it's only rebuilt when the installer
# itself changes:
# - a pull request that changes the installer, or the pinned image it's built in, builds it, to
#   check it, and publishes nothing;
# - a merge into main that changes it, or a run by hand, replaces OrielOS.iso and SHA256SUMS on
#   the latest release (a refresh of the pinned images alone doesn't: it reaches the installer
#   with the next release);
# - a new release (the Promote workflow) gets them too, so the latest release always carries the
#   installer, and the website's download section links it from there.
# After an upload the website is rebuilt, so its download link follows at once.

on:
  push:
    branches: [main]
    paths:
      - installer/**
      - image/keys/orielos-cosign.pub
      - tools/lib/pins.sh
      - .github/workflows/installer.yml
      - "!**.md"
  pull_request:
    paths:
      - installer/**
      - image/pins.env
      - .github/workflows/installer.yml
      - "!**.md"
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # lorax needs a few gigabytes of working space; it goes on the larger /mnt disk.
      - name: Make room for the build
        run: |
          sudo mkdir -p /mnt/installer /var/lib/orielos
          sudo ln -sfn /mnt/installer /var/lib/orielos/installer
          df -h / /mnt

      - name: Build the installer
        run: sudo installer/build-iso.sh --channel stable --output /var/lib/orielos/installer

      - name: Keep the installer for the publish job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            /var/lib/orielos/installer/OrielOS.iso
            /var/lib/orielos/installer/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Fetch the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer

      # A release from the Promote workflow gets its own copy; a change to the installer replaces
      # the copy on the latest release. Before the first release there's nowhere to put it.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum -c SHA256SUMS
          if [[ "${EVENT}" == release ]]; then
              tag="${RELEASE_TAG}"
          else
              tag="$(gh release view --repo "${REPO}" --json tagName -q .tagName 2>/dev/null || true)"
          fi
          if [[ -z "${tag}" ]]; then
              echo "::notice::No release yet, so the installer is kept only as this run's artifact"
              exit 0
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected release tag '${tag}'"; exit 1; }
          gh release upload "${tag}" OrielOS.iso SHA256SUMS --clobber --repo "${REPO}"
          echo "::notice::OrielOS.iso is on release ${tag}"
          echo "UPLOADED=1" >>"${GITHUB_ENV}"

      - name: Rebuild the website
        if: env.UPLOADED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run website.yml --repo "${REPO}" --ref main
