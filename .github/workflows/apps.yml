name: Apps

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apps:
    name: apps
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # apps is a required check, so the job always runs and reports, and only the build is
      # skipped when nothing it reads has changed; Markdown files never count. A pull request's
      # checkout is the pull request merged into its base branch, so HEAD^1 is the base; a merge
      # queue entry is compared with the queue's base. A push of more than one commit, or a
      # comparison that fails, counts as a change.
      - name: Check whether the change affects the apps
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          rc=0
          base=HEAD^1
          if [ "${EVENT}" = "merge_group" ]; then
              base="${QUEUE_BASE}"
              git fetch -q --depth=1 origin "${QUEUE_BASE}" || rc=2
          elif [ "${EVENT}" = "push" ] && [ "$(git rev-parse HEAD^1 2>/dev/null)" != "${BEFORE}" ]; then
              rc=2
          fi
          if [ "${rc}" -eq 0 ]; then
              git diff --quiet "${base}" HEAD -- \
                  apps plasma artwork data CMakeLists.txt \
                  image/Containerfile image/build/apps-builder.sh image/pins.env \
                  .containerignore .gitattributes tools/test-apps.sh tools/lib/pins.sh tools/lib/stage-inputs.sh \
                  .github/workflows/apps.yml \
                  ':(exclude)*.md' || rc=$?
          fi
          case "${rc}" in
              0)
                  changed=false
                  echo "::notice::No file the app build reads has changed, so the apps were not built."
                  ;;
              1) changed=true ;;
              *)
                  changed=true
                  echo "::warning::Couldn't compare with the previous commit, so the apps are built."
                  ;;
          esac
          echo "changed=${changed}" >>"${GITHUB_OUTPUT}"

      # Compiled objects are kept between runs, so an app change recompiles only what it touches.
      # The cache is keyed on the pinned images (the compiler comes from the builder image). A pull
      # request's cache is its own: it can read main's but never replace it.
      - name: Restore the compiler cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: apps-ccache-${{ hashFiles('image/pins.env') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apps-ccache-${{ hashFiles('image/pins.env') }}-


      # cosign checks the signature of the prebuilt build tools before the build starts from them.
      - name: Install cosign
        if: steps.changes.outputs.changed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The build starts from the prebuilt build tools (.github/workflows/stages.yml) where they
      # were built from this commit's inputs, and installs them itself otherwise.
      - name: Build and test the apps
        if: steps.changes.outputs.changed == 'true'
        env:
          ORIELOS_CCACHE_DIR: ${{ runner.temp }}/ccache
        run: tools/test-apps.sh --use-published

      - name: Keep the compiler cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: apps-ccache-${{ hashFiles('image/pins.env') }}-${{ github.run_id }}-${{ github.run_attempt }}
