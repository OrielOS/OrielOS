# Plugging in headphones, a headset or a USB or Bluetooth speaker makes it the sound output (and a
# headset's microphone the input), as Windows does. Headphones in a computer's own jack are
# switched to by WirePlumber already.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" flags = [ "nofail" ] }
]
