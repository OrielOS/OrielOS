#
# The first-run setup's welcome screen shows wallpapers/Next/contents/images/5120x2880.png (and
# images_dark/ with a dark colour scheme), looked up in the setup user's data folder before
# /usr/share. These links put the OrielOS wallpaper there; Qt reads the JPEG whatever the name.
# Plasma Setup's own tmpfiles.d file makes /run/plasma-setup, the setup user's home, at every
# boot and hands it to that user. Every folder is listed, so none is left to root.
d /run/plasma-setup/.local 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.local/share 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.local/share/wallpapers 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.local/share/wallpapers/Next 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.local/share/wallpapers/Next/contents 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.local/share/wallpapers/Next/contents/images_dark 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.local/share/wallpapers/Next/contents/images 0755 plasma-setup plasma-setup -
L /run/plasma-setup/.local/share/wallpapers/Next/contents/images/5120x2880.png - - - - /usr/share/wallpapers/OrielOS/contents/images/3840x2160.jpg
L /run/plasma-setup/.local/share/wallpapers/Next/contents/images_dark/5120x2880.png - - - - /usr/share/wallpapers/OrielOS/contents/images_dark/3840x2160.jpg
#
# OrielOS's additions to the setup's session, each owned by the setup user. Where Plasma Setup's
# own file names the same path (kglobalaccelrc), this file's line is used: its name sorts first.
#   The bottom-left corner: accessibility, volume and the keyboard layout.
d /run/plasma-setup/.config 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.config/autostart 0755 plasma-setup plasma-setup -
C /run/plasma-setup/.config/autostart/org.orielos.SetupCorner.desktop - - - - /usr/share/orielos/setup/org.orielos.SetupCorner.desktop
z /run/plasma-setup/.config/autostart/org.orielos.SetupCorner.desktop 0644 plasma-setup plasma-setup -
#   Shift+F10: a terminal, for technicians, allowed besides Plasma Setup's own shortcuts.
d /run/plasma-setup/.local/share/applications 0755 plasma-setup plasma-setup -
d /run/plasma-setup/.local/share/kglobalaccel 0755 plasma-setup plasma-setup -
C /run/plasma-setup/.local/share/applications/org.orielos.SetupTerminal.desktop - - - - /usr/share/orielos/setup/org.orielos.SetupTerminal.desktop
z /run/plasma-setup/.local/share/applications/org.orielos.SetupTerminal.desktop 0644 plasma-setup plasma-setup -
C /run/plasma-setup/.local/share/kglobalaccel/org.orielos.SetupTerminal.desktop - - - - /usr/share/orielos/setup/org.orielos.SetupTerminal.desktop
z /run/plasma-setup/.local/share/kglobalaccel/org.orielos.SetupTerminal.desktop 0644 plasma-setup plasma-setup -
C+ /run/plasma-setup/.config/kglobalaccelrc - - - - /usr/share/orielos/setup/kglobalaccelrc
z /run/plasma-setup/.config/kglobalaccelrc 0644 plasma-setup plasma-setup -
#   Win+Ctrl+Enter for the screen reader, besides Plasma's Win+Alt+S (KConfig separates two
#   shortcuts with a literal backslash and t).
f /run/plasma-setup/.config/kglobalshortcutsrc 0644 plasma-setup plasma-setup - [kaccess]\nToggle Screen Reader On and Off=Meta+Ctrl+Return\\tMeta+Alt+S,Meta+Alt+S,Toggle Screen Reader On and Off\n
#   The on-screen keyboard that KWin shows when the corner asks.
f /run/plasma-setup/.config/kwinrc 0644 plasma-setup plasma-setup - [Wayland]\nInputMethod[$e]=/usr/share/applications/org.kde.plasma.keyboard.desktop\n
