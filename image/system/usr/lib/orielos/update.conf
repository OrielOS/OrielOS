# Where orielos-update looks for OrielOS builds. Each channel (stable or testing) is a tag of this
# image. To use another source, set source= in /etc/orielos/update.conf, which overrides this file:
#   source=docker://<registry>/<repository>   an image in a container registry
#   source=oci:/<directory>                   an OCI image layout directory with one tag per channel
source=docker://ghcr.io/ncjsvr/orielos
