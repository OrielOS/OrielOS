# OrielOS: the boot menu stays hidden while the last boot reached the desktop. The flag lives in
# orielos-boot.env next to GRUB on the EFI system partition, because GRUB can't write to /boot on
# Btrfs. Every boot clears it here, and orielos-boot-success.service sets it again once Plasma's
# desktop is up, so after a boot that never got that far the menu is shown, listing the current
# and the previous versions. Pressing Esc or holding Shift during the hidden second shows the menu
# too. Until the file exists, after a new installation, the menu stays hidden.
set timeout_style=hidden
set timeout=1
if [ -f "${cmdpath}/orielos-boot.env" ]; then
  load_env -f "${cmdpath}/orielos-boot.env" orielos_boot_ok
  if [ "${orielos_boot_ok}" = "0" ]; then
    set timeout_style=menu
    set timeout=10
  fi
  set orielos_boot_ok=0
  save_env -f "${cmdpath}/orielos-boot.env" orielos_boot_ok
fi
