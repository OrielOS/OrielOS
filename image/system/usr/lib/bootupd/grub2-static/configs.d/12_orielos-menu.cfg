# OrielOS: the boot menu stays hidden while the last boot reached the desktop. The flag lives in
# EFI/fedora/orielos-boot.env on the EFI system partition, because GRUB can't write to /boot on
# Btrfs. Every boot clears it here, and orielos-boot-success.service sets it again once Plasma's
# desktop is up, so after a boot that never got that far the menu is shown, listing the current
# and the previous versions. Pressing Esc or holding Shift during the hidden second shows the menu
# too. Until the file exists, after a new installation, the menu stays hidden.
set timeout_style=hidden
set timeout=1
# The EFI system partition is on the disk that holds /boot (${root}, such as hd0,gpt3). GRUB's
# ${cmdpath} would name it, but shim leaves it empty. [ -f ] is quiet about partitions that don't
# exist.
unset orielos_env
regexp --set=1:orielos_disk '^([^,]+),' "${root}"
for orielos_part in gpt1 gpt2 gpt3 gpt4 gpt5 gpt6 gpt7 gpt8; do
  if [ -z "${orielos_env}" ]; then
    if [ -f "(${orielos_disk},${orielos_part})/EFI/fedora/orielos-boot.env" ]; then
      set orielos_env="(${orielos_disk},${orielos_part})/EFI/fedora/orielos-boot.env"
    fi
  fi
done
if [ -n "${orielos_env}" ]; then
  load_env -f "${orielos_env}" orielos_boot_ok
  if [ "${orielos_boot_ok}" = "0" ]; then
    set timeout_style=menu
    set timeout=10
  fi
  set orielos_boot_ok=0
  save_env -f "${orielos_env}" orielos_boot_ok
fi
