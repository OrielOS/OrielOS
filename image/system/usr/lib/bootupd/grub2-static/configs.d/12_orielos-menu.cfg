# OrielOS: the boot menu stays hidden; pressing Esc or holding Shift during the hidden second shows
# it. An update that doesn't reach the desktop is undone without asking: the flags live in
# EFI/fedora/orielos-boot.env on the EFI system partition (GRUB can't write to /boot on Btrfs), and
# /usr/libexec/orielos/boot-flags explains them. Every start clears orielos_boot_ok here, and the
# desktop sets it again. If a newly installed version (orielos_trial=1) fails to reach the desktop
# twice, the next start uses the previous version, the second entry; OrielOS then keeps it. Only if
# that fails too does the menu appear, as the last resort. Until the file exists, after a new
# installation, nothing changes.
set timeout_style=hidden
set timeout=1
# The EFI system partition is on the disk that holds /boot (${root}, such as hd0,gpt3). GRUB's
# ${cmdpath} would name it, but shim leaves it empty. [ -f ] is quiet about partitions that don't
# exist.
unset orielos_env
regexp --set=1:orielos_disk '^([^,]+),' "${root}"
for orielos_part in gpt1 gpt2 gpt3 gpt4 gpt5 gpt6 gpt7 gpt8; do
  if [ -z "${orielos_env}" ]; then
    if [ -f "(${orielos_disk},${orielos_part})/EFI/fedora/orielos-boot.env" ]; then
      set orielos_env="(${orielos_disk},${orielos_part})/EFI/fedora/orielos-boot.env"
    fi
  fi
done
if [ -n "${orielos_env}" ]; then
  load_env -f "${orielos_env}" orielos_boot_ok orielos_trial orielos_fails
  if [ "${orielos_boot_ok}" = "0" ]; then
    if [ "${orielos_trial}" = "1" ]; then
      if [ "${orielos_fails}" = "1" ]; then
        # The second failed start of the new version: start the previous one.
        set default=1
        set orielos_trial=fallback
      else
        set orielos_fails=1
      fi
    elif [ "${orielos_trial}" = "fallback" ]; then
      # The previous version didn't reach the desktop either: let the person choose.
      set timeout_style=menu
      set timeout=30
    elif [ "${orielos_trial}" = "kept" ]; then
      set timeout_style=menu
      set timeout=30
    fi
  fi
  set orielos_boot_ok=0
  save_env -f "${orielos_env}" orielos_boot_ok orielos_trial orielos_fails
fi
