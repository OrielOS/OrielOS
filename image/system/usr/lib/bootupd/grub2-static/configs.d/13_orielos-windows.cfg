# OrielOS: on a PC that also has Windows, the boot menu lists it and shows for five seconds at
# every start, so Windows is one key press away. Windows Boot Manager is looked for on every
# partition GRUB can read; without it this adds nothing and the menu stays hidden. When
# 12_orielos-menu.cfg has already shown the menu after failed starts, its longer timeout stays.
if [ "$grub_platform" = "efi" ]; then
  unset orielos_windows
  search --no-floppy --file --set=orielos_windows /EFI/Microsoft/Boot/bootmgfw.efi
  if [ -n "${orielos_windows}" ]; then
    menuentry 'Windows' --class windows --class os $menuentry_id_option 'windows' {
      search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
      chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    }
    if [ "${timeout_style}" = "hidden" ]; then
      set timeout_style=menu
      set timeout=5
    fi
  fi
fi
