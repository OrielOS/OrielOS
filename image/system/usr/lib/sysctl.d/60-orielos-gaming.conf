# Settings some games need.
# Some games, mostly Windows games run through Proton, need more memory map areas than the
# kernel's default allows, and crash without them. Fedora's own 10-map-count.conf sets the same
# value; it's set here too, so OrielOS keeps it whatever Fedora changes.
vm.max_map_count = 1048576
# The kernel deliberately slows a process that splits a lock across cache lines, as some older
# games do, which makes them stutter. With 0 it still logs a warning but doesn't slow them.
kernel.split_lock_mitigate = 0
