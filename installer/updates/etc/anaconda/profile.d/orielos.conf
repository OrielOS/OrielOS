# Anaconda configuration for the OrielOS network installer: Fedora's defaults (Btrfs with zstd:1,
# EFI files in EFI/fedora, where the image's shim lives), without the account pages, because
# Plasma Setup creates the account on first boot.

[Profile]
profile_id = orielos
base_profile = fedora

[Profile Detection]
os_id = generic

[User Interface]
# Fedora's stylesheet comes with fedora-logos, which the installer doesn't carry.
custom_stylesheet =
hidden_spokes =
    PasswordSpoke
    UserSpoke
